image : registry.gitlab.com/tamrontechnology2020/akoneya_job:latest

stages : 
  - build
  - test

composer :
  stage : build
  script :
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts --no-suggest
    - cp .env.example .env
    - php artisan key:generate
    - php artisan jwt:secret
    - touch database/test.sqlite
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/'
      when: manual
  artifacts:
    # (Optional) Give it an expiration date, 
    # after that period you won't be able to download them via the UI anymore.
    paths:
      - vendor/
      - .env
    expire_in: 1 month
    when: always
  cache:
    paths:
      - vendor/

phpunit:
  stage: test
  dependencies:
    - composer
  script:
    - vendor/phpunit/phpunit/phpunit --version
    - vendor/bin/phpunit
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^feature/'
      when: manual

    
    
