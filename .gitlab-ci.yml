image : registry.gitlab.com/tamrontechnology2020/akoneya_newsfeed:latest

stages : 
  - build
  - test

composer :
  stage : build
  script :
    - cp .env.example .env
    - touch database/test.sqlite
    - php artisan key:generate
    - composer install --prefer-dist
  artifacts:
    # (Optional) Give it an expiration date, 
    # after that period you won't be able to download them via the UI anymore.
    paths:
      - vendor/
      - .env
    expire_in: 1 month
    when: always
  cache:
    paths:
      - vendor/

phpunit:
  stage: test
  dependencies:
    - composer
  script:
    - vendor/phpunit/phpunit/phpunit --version
    - vendor/bin/phpunit

    
    
